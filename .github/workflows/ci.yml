name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (incl. Ghostscript WASM)
        run: npm test
      - name: Build
        run: npm run build
      - name: dist/ is up to date
        run: |
          if ! git diff --exit-code --stat dist/; then
            echo "::error::dist/ 与源码不一致，请运行 npm run build 并提交 dist/"
            exit 1
          fi
